[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pbpk-mcp"
version = "1.0.0"
description = "High-performance Python PBPK ODE execution engine reverse-engineered from Open Systems Pharmacology"
authors = [{ name = "PBPK Core Team" }]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "numba>=0.60.0",
    "matplotlib>=3.8.0",
    "fastmcp>=0.1.0",
    "mcp>=1.0.0"
]
requires-python = ">=3.10"

[project.scripts]
pbpk-mcp = "pbpk.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pbpk*"]
